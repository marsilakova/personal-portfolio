<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />

    <!-- SEO: Заголовок и описание для поисковиков -->
    <title>Marina Silakova | Frontend & Fullstack Developer Portfolio</title>
    <meta name="description" content="Personal developer portfolio of Marina Silakova in Malmö, Sweden. Explore interactive web projects built with React, JavaScript, HTML5, CSS3, C#, and .NET." />
    <meta name="keywords" content="Marina Silakova, Portfolio, Frontend Developer, Fullstack Developer, React, Vite, JavaScript, C#, .NET, Web Development, Malmö, Sweden" />
    <meta name="author" content="Marina Silakova" />

    <!-- Open Graph: красивая карточка при отправке ссылки в LinkedIn или Telegram -->
    <meta property="og:title" content="Marina Silakova – Frontend & Fullstack Developer Portfolio" />
    <meta property="og:description" content="Interactive portfolio showcasing Frontend and Backend projects in React, JavaScript, and C#." />
    <meta property="og:type" content="website" />

    <!-- Структурированные данные Google (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Marina Silakova",
        "jobTitle": "Frontend & Fullstack Developer",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Malmö",
          "addressCountry": "Sweden"
        },
        "url": "https://github.com",
        "sameAs": [
          "https://github.com"
        ],
        "knowsAbout": ["React", "JavaScript", "HTML5", "CSS3", "C#", ".NET", "Git"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
